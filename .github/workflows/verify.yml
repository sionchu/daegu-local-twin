name: verify

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g npm@11.6.0 --no-audit --no-fund
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m unittest scripts.ingest.test_refresh_daegu_transit
      - run: python -m py_compile vision/analyze_footfall.py scripts/ingest/refresh_daegu_transit.py
      - run: git diff --check
